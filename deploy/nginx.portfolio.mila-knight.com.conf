# /etc/nginx/conf.d/portfolio.mila-knight.com.conf
# Next.js app (pm2 "portfolio") on 127.0.0.1:3040

server {
    listen 80;
    server_name portfolio.mila-knight.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        allow all;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name portfolio.mila-knight.com;

    ssl_certificate /etc/letsencrypt/live/portfolio.mila-knight.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portfolio.mila-knight.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # رفع الصور (10MB) والفيديو (100MB) من الداشبورد
    client_max_body_size 120m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        allow all;
        default_type "text/plain";
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3040;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }
}
